spring.application.name=BookMyShow

# ---------------------------------------------------------------------------
# Data source
# ---------------------------------------------------------------------------
# H2 in-memory. Dev/test only - a real deployment points this at Postgres and
# sets spring.jpa.hibernate.ddl-auto=validate so schema drift fails fast.
spring.datasource.url=jdbc:h2:mem:bms;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the life of the JVM.
# Without it, the database is discarded when the first connection closes, and a
# connection pool that recycles connections loses the schema between calls.

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# open-in-view=false is the default since Boot 2.2 but is set explicitly because
# the whole service layer depends on it: DTO mapping happens inside the
# transaction, so a LAZY collection is never touched after the session closes.

# ---------------------------------------------------------------------------
# SQL init
# ---------------------------------------------------------------------------
# The file MUST be named data.sql (all lowercase). Spring Boot resolves the
# default location classpath*:data.sql, and classpath lookups inside a packaged
# jar are case-sensitive. A file named Data.sql loads fine from an IDE or
# `mvn test` (directory on a case-insensitive filesystem) and is silently
# skipped in the fat jar, because the location is prefixed with `optional:`.
# That produces an app that starts cleanly against a completely empty database.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Booking rules
# ---------------------------------------------------------------------------
# Seats are held for this long while the user is on the payment page.
booking.hold-minutes=5
# How often lapsed holds are swept out of the DB. Correctness does not depend on
# this running; it only keeps stored status from lying about expired holds.
booking.sweep-interval-ms=30000

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.org.hibernate.SQL=INFO
# Uncomment to see the generated JPQL and the parameters bound to it. This is the
# fastest way to debug a query that returns nothing when you expect rows.
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
